<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stormwatch</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--surface:#fff;--ink:#14212e;--mute:#5a6b7b;--line:#d5dde5;--accent:#1d5fa8;--r:10px;
--tw:#d62828;--tww:#c9a400;--sw:#e8700a;--sww:#c2477a;--fw:#1f8f3a;--fww:#2a7a5a;--wsw:#d6409f;--wwa:#6a5acd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--surface:#17222f;--ink:#e8eef4;--mute:#93a4b4;--line:#2a3a4a;--accent:#6aa9ea;--tww:#e0bd2a;--wwa:#9a8cf0;--fw:#3fc25f;--fww:#4cb589;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1620;--surface:#17222f;--ink:#e8eef4;--mute:#93a4b4;--line:#2a3a4a;--accent:#6aa9ea;--tww:#e0bd2a;--wwa:#9a8cf0;--fw:#3fc25f;--fww:#4cb589;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3,.num{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
select,button{font:inherit;color:inherit}
select{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:44px}
.icon{min-height:44px;min-width:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{border-radius:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c,var(--accent))}
.hero .lvl{font:600 14px "Barlow Semi Condensed";color:var(--c,var(--mute))}
.hero h1{font-size:28px;line-height:1.1;margin:2px 0 6px}
.now{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.now .num{font-size:64px;font-weight:600;line-height:1}
.now .meta{color:var(--mute);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:center}
.stat b{display:block;font:600 18px "Barlow Semi Condensed"}.stat span{font-size:13px;color:var(--mute)}
nav{display:flex;gap:6px;margin:14px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:4px 0;z-index:2}
nav button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);cursor:pointer;font-weight:500}
nav button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:var(--surface);cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.alert{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:var(--r);margin-bottom:10px}
.alert summary{list-style:none;cursor:pointer;padding:12px;min-height:44px}
.alert summary::-webkit-details-marker{display:none}
.alert h3{font-size:19px}
.alert .sub{color:var(--mute);font-size:14px}
.alert .body{padding:0 12px 12px;font-size:15px}
.alert ul{margin:6px 0 0;padding-left:20px}
.tag{display:inline-block;font:600 13px "Barlow Semi Condensed";padding:2px 8px;border-radius:6px;color:#fff;background:var(--c);margin-right:6px}
.tag.dk{color:#1a1400}
.empty{padding:24px 12px;text-align:center;color:var(--mute);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.hr{flex:none;width:64px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px}
.hr b{display:block;font:600 18px "Barlow Semi Condensed"}.hr span{font-size:13px;color:var(--mute)}
.day{display:grid;grid-template-columns:56px 32px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--sw))}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;min-height:52px;width:100%;text-align:left;cursor:pointer}
.sw i{font-style:normal;font-weight:600;min-width:44px;text-align:right;color:var(--mute)}
.sw[aria-checked=true] i{color:var(--fw)}
h2{font-size:20px;margin:14px 0 8px}
.note{color:var(--mute);font-size:14px;margin-top:12px}
#map,#dmap{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.gl{stroke:var(--line);stroke-width:.3}.rv{stroke:var(--accent);opacity:.5;fill:none;stroke-width:2}.rd{stroke:var(--line);fill:none;stroke-width:1}
.ring{fill:none;stroke:var(--mute);stroke-dasharray:2 2;stroke-width:.3}.rl{font-size:4px;fill:var(--mute)}
#map polygon{cursor:pointer}
[hidden]{display:none!important}
nav{overflow-x:auto}nav button{flex:1 0 auto;padding:0 12px}
.wrap{flex-wrap:wrap;overflow:visible}
.act{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.act button{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.act button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.act input{width:72px;min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
#dmap [data-id]{touch-action:none;cursor:grab}
#dmap [data-v],#dmap [data-e]{touch-action:none;cursor:move}
.lbl{font:600 5.5px "Barlow Semi Condensed";fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:1.4px;text-anchor:middle;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.alert[open] .body{animation:o .15s ease-out}@keyframes o{from{opacity:0}to{opacity:1}}}
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
</head>
<body>
<main>
  <div class="top">
    <label for="city" style="position:absolute;left:-9999px">Location</label>
    <select id="city"></select>
    <button class="icon" id="theme" aria-label="Switch light or dark theme">◐</button>
  </div>
  <section class="hero" id="hero"></section>
  <div class="stats" id="stats"></div>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" aria-selected="true" data-t="alerts">Alerts</button>
    <button role="tab" aria-selected="false" data-t="map">Map</button>
    <button role="tab" aria-selected="false" data-t="design">Design</button>
    <button role="tab" aria-selected="false" data-t="forecast">Forecast</button>
    <button role="tab" aria-selected="false" data-t="settings">My alerts</button>
  </nav>
  <div id="view"></div>
  <p class="note">Sample data for design and testing. Connect a live source such as the National Weather Service API before relying on it for safety.</p>
</main>
<script>
const TYPES={
 tw:{n:"Tornado Warning",s:5,c:"var(--tw)",d:0,tip:["Go to a basement or an interior room on the lowest floor now","Stay away from windows","Cover your head and neck","If in a vehicle, don’t outrun it. Find a sturdy building"]},
 tww:{n:"Tornado Watch",s:3,c:"var(--tww)",d:1,tip:["Conditions favor tornadoes. Stay alert","Pick your shelter spot now","Keep a phone charged and a weather radio on","Be ready to move fast if a warning is issued"]},
 sw:{n:"Severe Thunderstorm Warning",s:4,c:"var(--sw)",d:0,tip:["Move indoors away from windows","Expect damaging wind and large hail","Unplug sensitive electronics","Wait 30 minutes after the last thunder before going out"]},
 sww:{n:"Severe Thunderstorm Watch",s:2,c:"var(--sww)",d:0,tip:["Storms may become severe in the next few hours","Secure outdoor furniture","Check the sky and your alerts often"]},
 fw:{n:"Flood Warning",s:4,c:"var(--fw)",d:0,tip:["Move to higher ground","Never drive through flooded roads. Turn around","Avoid walking in moving water","Shut off utilities if told to evacuate"]},
 fww:{n:"Flood Watch",s:2,c:"var(--fww)",d:0,tip:["Flooding is possible. Know your route to high ground","Move valuables out of basements","Don’t park near streams or low spots"]},
 wsw:{n:"Winter Storm Warning",s:4,c:"var(--wsw)",d:0,tip:["Avoid travel. Roads may become impassable","Keep a blanket, food and water in your car","Prepare for power outages","Never run a generator indoors"]},
 wwa:{n:"Winter Weather Advisory",s:1,c:"var(--wwa)",d:0,tip:["Slick roads likely. Slow down and leave extra distance","Dress in layers","Allow extra time for your commute"]},
 wsww:{n:"Winter Storm Watch",s:2,c:"#3b82c4",d:0,tip:["Heavy snow or ice is possible in the next 12 to 48 hours","Fill your gas tank and stock food and water","Charge devices and check on neighbors"]},
 wi:{n:"Wind Advisory",s:1,c:"#a9825a",d:0,tip:["Secure trash cans, patio furniture and loose items","Take extra care driving a high-profile vehicle","Watch for downed branches and power lines"]}
};
const CITIES={
 okc:{n:"Oklahoma City, OK",t:74,f:78,cond:"Humid, storms building",ic:"⛈️",w:"S 22 mph",h:78,uv:6,vis:"6 mi",
  a:[["tw","Cleveland County","Tornado near Moore moving northeast at 30 mph",45],["sw","Oklahoma County","Wind gusts to 70 mph and quarter-size hail",90],["tww","Central Oklahoma","Until 10 PM CDT",300],["fww","Southern Oklahoma","Heavy rain on saturated ground",600]]},
 msp:{n:"Minneapolis, MN",t:24,f:15,cond:"Heavy snow",ic:"🌨️",w:"NW 18 mph",h:82,uv:1,vis:"1 mi",
  a:[["wsw","Hennepin County","8 to 12 inches of snow with blowing snow",840],["wwa","Anoka County","2 to 4 inches of snow and slick roads",360]]},
 hou:{n:"Houston, TX",t:71,f:71,cond:"Steady heavy rain",ic:"🌧️",w:"E 14 mph",h:94,uv:2,vis:"3 mi",
  a:[["fw","Harris County","Bayou levels rising. Street flooding underway",420],["fww","Brazoria County","3 to 5 inches of additional rain possible",720]]},
 bna:{n:"Nashville, TN",t:68,f:68,cond:"Warm and gusty",ic:"🌥️",w:"SW 20 mph",h:70,uv:4,vis:"8 mi",
  a:[["sww","Davidson County","Until 9 PM CST",240],["wi","Middle Tennessee","Southwest winds 20 to 30 mph, gusts to 45",420]]},
 san:{n:"San Diego, CA",t:72,f:71,cond:"Sunny",ic:"☀️",w:"W 8 mph",h:55,uv:7,vis:"10 mi",a:[]},
 chi:{n:"Chicago, IL",t:31,f:22,cond:"Windy and cold",ic:"💨",w:"NW 28 mph",h:64,uv:2,vis:"7 mi",
  a:[["wsww","Cook County","Heavy snow possible Saturday. 6 to 10 inches",1500],["wi","Lake County, IL","Northwest winds 25 to 35 mph, gusts to 50",300]]}
};
const ICONS=["☀️","⛅","☁️","🌧️","⛈️","🌨️"];
let city="okc",tab="alerts",filter=null,follow={};
Object.keys(TYPES).forEach(k=>follow[k]=true);
try{const s=localStorage.getItem("sw-follow");if(s)follow=Object.assign(follow,JSON.parse(s))}catch(e){}
const $=s=>document.querySelector(s),C=()=>CITIES[city];
const fmt=m=>m<60?m+" min":(Math.round(m/6)/10)+" hr";
let you={x:100,y:100},sel=null;
const R={tw:11,sw:20,fw:24,fww:55,sww:60,tww:65,wsw:45,wwa:50,wsww:60,wi:55};
function geo(k,i){const ang=i*2.4+k.length,d=i*30+14,cx=100+Math.cos(ang)*d*.9,cy=100+Math.sin(ang)*d*.9,r=R[k],p=[];for(let j=0;j<10;j++){const t=j/10*6.283,rr=r*(.78+.22*Math.sin(j*2.3+i+k.length));p.push([cx+Math.cos(t)*rr*1.3,cy+Math.sin(t)*rr*.8])}return p}
function dist(p,poly){let ins=false,min=1e9;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[a,b]=poly[i],[c,d]=poly[j];if((b>p.y)!==(d>p.y)&&p.x<(c-a)*(p.y-b)/(d-b)+a)ins=!ins;const dx=c-a,dy=d-b,t=Math.max(0,Math.min(1,((p.x-a)*dx+(p.y-b)*dy)/(dx*dx+dy*dy||1))),ex=a+t*dx-p.x,ey=b+t*dy-p.y;min=Math.min(min,Math.hypot(ex,ey))}return ins?0:min}
function active(){return C().a.map((a,i)=>{const poly=geo(a[0],i);return{k:a[0],area:a[1],txt:a[2],m:a[3],T:TYPES[a[0]],poly,d:dist(you,poly),i}}).filter(a=>follow[a.k]).sort((x,y)=>y.T.s-x.T.s)}
function head(){
 const c=C(),al=active(),top=al[0];
 $("#hero").style.setProperty("--c",top?top.T.c:"var(--accent)");
 $("#hero").innerHTML=(top?`<div class="lvl">${al.length} active alert${al.length>1?"s":""}. Most serious:</div><h1>${top.T.n}</h1><div>${top.area}. ${top.txt}. Expires in ${fmt(top.m)}.</div>`:`<div class="lvl">No active alerts</div><h1>All clear</h1><div>Nothing to act on in ${c.n}.</div>`)+
 `<div class="now"><div class="num">${c.t}°</div><div><div style="font-size:22px">${c.ic} ${c.cond}</div><div class="meta">Feels like ${c.f}° · ${c.n}</div></div></div>`;
 $("#stats").innerHTML=[["Wind",c.w],["Humidity",c.h+"%"],["UV",c.uv],["Visibility",c.vis]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("");
}
function alerts(){
 const all=C().a.map(a=>a[0]),kinds=[...new Set(all)].filter(k=>follow[k]);
 let list=active().filter(a=>!filter||a.k===filter);
 let h="";
 if(kinds.length>1)h+=`<div class="chips">`+`<button class="chip" style="--c:var(--accent)" aria-pressed="${!filter}" data-f="">All</button>`+kinds.map(k=>`<button class="chip" style="--c:${TYPES[k].c}" aria-pressed="${filter===k}" data-f="${k}">${TYPES[k].n}</button>`).join("")+`</div>`;
 if(!list.length)return h+`<div class="empty">No alerts for this place. Open “My alerts” to change which types you see.</div>`;
 return h+list.map((a,i)=>`<details class="alert" style="--c:${a.T.c}" ${i===0?"open":""}><summary><span class="tag ${a.k==="tww"?"dk":""}">${a.T.n.split(" ").pop().toUpperCase()}</span><h3 style="display:inline">${a.T.n}</h3><div class="sub">${a.area} · ${a.d?Math.round(a.d)+" mi away":"you’re inside this area"} · expires in ${fmt(a.m)}</div></summary><div class="body"><p style="margin:0">${a.txt}.</p><b>What to do</b><ul>${a.T.tip.map(t=>`<li>${t}</li>`).join("")}</ul></div></details>`).join("");
}
function forecast(){
 const c=C();let h=`<h2>Next 12 hours</h2><div class="row">`;
 for(let i=0;i<12;i++){const hr=(new Date().getHours()+i)%24,t=Math.round(c.t+3*Math.sin(i/3)-i*.4),lab=(hr%12||12)+(hr<12?" AM":" PM");h+=`<div class="hr"><span>${i?lab:"Now"}</span><b>${ICONS[(i+city.length)%4===3&&c.a.length?4:(i%3)]}</b><b>${t}°</b></div>`}
 h+=`</div><h2>7 days</h2>`;
 const D=["Today","Fri","Sat","Sun","Mon","Tue","Wed"];
 D.forEach((d,i)=>{const hi=Math.round(c.t+4+Math.cos(i)*5-i),lo=hi-14+i%3;h+=`<div class="day"><b>${d}</b><span>${ICONS[(i*2+city.length)%6]}</span><div class="bar" style="width:${50+(hi%40)}%"></div><span>${hi}° / ${lo}°</span></div>`});
 return h;
}
function mlist(){return active().sort((x,y)=>x.d-y.d).map(a=>`<button class="sw" style="--c:${a.T.c};${sel===a.i?"box-shadow:0 0 0 2px "+a.T.c:""}" data-m="${a.i}"><span><b>${a.T.n}</b><br><small>${a.area}${sel===a.i?". "+a.txt:""}</small></span><i>${a.d?Math.round(a.d)+" mi":"Inside"}</i></button>`).join("")||`<div class="empty">No alerts to map. Open “My alerts” to turn types back on.</div>`}
function map(){
 let s=`<svg id="map" viewBox="0 0 200 200" role="img" aria-label="Alert map. 1 grid square is 25 miles.">`;
 for(let i=25;i<200;i+=25)s+=`<path class="gl" d="M${i} 0V200M0 ${i}H200"/>`;
 s+=`<path class="rv" d="M0 150C40 120 60 170 100 140S160 90 200 110"/><path class="rd" d="M20 0L70 200M0 60H200M130 0L180 200"/>`;
 [25,50,75].forEach(r=>s+=`<circle class="ring" cx="${you.x}" cy="${you.y}" r="${r}"/><text class="rl" x="${you.x+r+1}" y="${you.y-1}">${r} mi</text>`);
 active().reverse().forEach(a=>s+=`<polygon data-m="${a.i}" points="${a.poly.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="${a.T.c}" fill-opacity="${sel===a.i?.55:.3}" stroke="${a.T.c}" stroke-width="${sel===a.i?2.5:1.2}"/>`);
 s+=`<g id="you" tabindex="0" role="slider" aria-label="Your location. Drag or use arrow keys." transform="translate(${you.x} ${you.y})" style="touch-action:none;cursor:grab"><circle r="12" fill="transparent"/><circle r="4.5" fill="var(--accent)" stroke="#fff" stroke-width="1.5"/></g><text class="rl" x="4" y="9">N ↑</text></svg>`;
 return `<p class="note" style="margin:0 0 8px">Drag the blue dot to see how far each alert is from you. Tap an area for details.</p>`+s+`<h2>Nearest first</h2><div id="mlist">${mlist()}</div>`}
function setupMap(){const svg=$("#map"),me=$("#you");
 const mv=()=>{me.setAttribute("transform",`translate(${you.x} ${you.y})`);$("#mlist").innerHTML=mlist()},cl=v=>Math.max(0,Math.min(200,v));
 me.onpointerdown=e=>{me.setPointerCapture(e.pointerId);me.dataset.d=1};
 me.onpointermove=e=>{if(!me.dataset.d)return;const r=svg.getBoundingClientRect();you.x=cl((e.clientX-r.left)/r.width*200);you.y=cl((e.clientY-r.top)/r.height*200);mv()};
 me.onpointerup=()=>{delete me.dataset.d;render()};
 me.onkeydown=e=>{const k={ArrowLeft:[-5,0],ArrowRight:[5,0],ArrowUp:[0,-5],ArrowDown:[0,5]}[e.key];if(k){e.preventDefault();you.x=cl(you.x+k[0]);you.y=cl(you.y+k[1]);mv()}}}
let D=[],tool=null,draft=[],dsel=null,dtemp=72,clr=false,lastUp=0,free=false,rm=false,pan=false,panD=null,vb={x:0,y:0,w:200},US=null,usErr=false;
try{const s=localStorage.getItem('sw-design2');if(s)D=JSON.parse(s)}catch(e){}
const nid=()=>Math.floor(Math.random()*1e9),save=()=>{try{localStorage.setItem('sw-design2',JSON.stringify(D))}catch(e){}};
const WI=['☀️','⛅','☁️','🌧️','⛈️','🌨️','💨','🌫️'];
const cen=p=>[p.reduce((s,q)=>s+q[0],0)/p.length,p.reduce((s,q)=>s+q[1],0)/p.length];
const pts=p=>p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
function finish(){const x={id:nid(),kind:'area',k:tool.k,pts:draft};D.push(x);draft=[];dsel=x.id;tool=null;save()}
function design(){
 const k=vb.w/200,S=D.find(x=>x.id===dsel),tc=tool&&tool.k?TYPES[tool.k].c:'var(--accent)';
 const pal=`<button class='chip' style='--c:var(--accent)' aria-pressed='${!tool}' data-dt='s'>Select and move</button>`+Object.keys(TYPES).sort((a,b)=>TYPES[b].s-TYPES[a].s).map(k=>`<button class='chip' style='--c:${TYPES[k].c}' aria-pressed='${!!tool&&tool.k===k}' data-dt='a:${k}'>${TYPES[k].n}</button>`).join('');
 const ics=WI.map(i=>`<button class='chip' style='--c:var(--accent)' aria-label='Place forecast icon ${i}' aria-pressed='${!!tool&&tool.ic===i}' data-dt='m:${i}'>${i}</button>`).join('');
 const hint=pan?'Pan is on. Drag the map to move around and use Zoom in to see counties. Turn Pan off to draw or select.':tool&&tool.k&&free?'Press and drag on the map to draw the outline. Lift your finger to finish.':tool&&tool.k?(draft.length?draft.length+' corner'+(draft.length>1?'s':'')+' placed. Keep tapping, then tap Finish area or the first corner.':'Tap the map to place the corners of the area.'):tool?'Set a temperature below, then tap the map to place the forecast icon.':'Pick an alert type or a forecast icon, then tap the map. Tap a shape to select it. Drag it to move, or drag its corner dots to reshape. Drag a faint dot between two corners to add a corner.';
 let s=`<svg id='dmap' style='${pan||tool&&tool.k&&free?'touch-action:none':''}' viewBox='${vb.x} ${vb.y} ${vb.w} ${vb.w*.625}' role='img' aria-label='Design canvas. 1 grid square is 25 miles.'>`;
 s+=base();
 s+=``;
 D.forEach(x=>{const on=x.id===dsel;
